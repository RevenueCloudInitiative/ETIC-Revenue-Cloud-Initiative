name: Salesforce PR Validation

on:
  push:
    branches-ignore:
      - main

jobs:
  validate:
    name: Validate Salesforce Deployment
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Install SFDX Git Delta
        run: sf plugins install sfdx-git-delta

      - name: Authenticate to Salesforce
        run: |
          echo "${{ secrets.SFDX_AUTH_URL_PROD }}" > auth.txt
          sf org login sfdx-url \
            --sfdx-url-file auth.txt \
            --alias target
          rm -f auth.txt

      - name: Generate Delta Package
        run: |
          mkdir delta

          sf sgd source delta \
            --from origin/main \
            --to HEAD \
            --output-dir delta

          echo "Generated package:"
          cat delta/package/package.xml

      - name: Validate Deployment
        run: |
          if [ ! -f delta/package/package.xml ]; then
            echo "No package.xml generated"
            exit 0
          fi

          sf project deploy start \
            --manifest delta/package/package.xml \
            --target-org target \
            --dry-run \
            --wait 120 \
            --test-level RunLocalTests

      - name: Clean Up
        if: always()
        run: rm -f auth.txt